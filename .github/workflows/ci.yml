name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yufei-pan/TSVZ
          path: TSVZ
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          TSVZ_PY: ${{ github.workspace }}/TSVZ/TSVZ.py
          TSVZ_REQUIRE_INTEROP: "1"
      - run: cargo build --release
      - run: python3 TSVZ/tsvzconform.py --impl target/release/tsvz --class reader,writer,cli --feature bzip2,xz,zstd,crc32,crc32c,sha256,blake3,file-first
      - run: python3 difftest/difftest.py --rust target/release/tsvz --tsvz TSVZ/TSVZ.py --seeds 0:200
