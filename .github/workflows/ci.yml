name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tsvz-org/TSVZ
          path: TSVZ
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The library alone, without the command line and C libraries (README).
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test --no-fail-fast
        env:
          TSVZ_PY: ${{ github.workspace }}/TSVZ/TSVZ.py
          TSVZ_REQUIRE_INTEROP: "1"
      # The library's tests again with classic POSIX locks, which macOS always takes.
      - run: cargo test --lib
        if: runner.os == 'Linux'
        env:
          TSVZ_TEST_CLASSIC_LOCKS: "1"
      - run: cargo build --release
      - run: python3 TSVZ/tsvzconform.py --impl target/release/tsvz --class reader,writer,cli,handler --feature bzip2,xz,zstd,crc32,crc32c,sha256,blake3,file-first,handler,scrub-multipart
      - run: python3 difftest/difftest.py --rust target/release/tsvz --tsvz TSVZ/TSVZ.py --seeds 0:200
      - run: python3 difftest/difftest.py --rust target/release/tsvz --tsvz TSVZ/TSVZ.py --seeds 0:100 --handler
      - run: python3 difftest/difftest.py --rust target/release/tsvz --tsvz TSVZ/TSVZ.py --seeds 0:100 --scrub
  msrv:
    # rust-version in Cargo.toml: the oldest Rust the crate builds with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: "1.85"
      - run: cargo check --all-targets
