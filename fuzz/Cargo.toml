[package]
name = "tsvz-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tsvz = { path = "..", default-features = false, features = ["bzip2", "xz", "zstd"] }

[[bin]]
name = "replay"
path = "fuzz_targets/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
